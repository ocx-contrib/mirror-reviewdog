extends: ../mirror-base.yml

name: reviewdog

# Logical index package `reviewdog/reviewdog` at the physical path
# `ghcr.io/ocx-contrib/reviewdog/reviewdog` — slash segments, never
# hyphen-flattened. The first segment must be this repo's own GitHub owner:
# GITHUB_TOKEN only authorises packages owned by the repo the workflow runs in.
#
# Upstream's owner is the GitHub org `reviewdog`, and the tool is `reviewdog`,
# so namespace and name coincide — no naming decision to make here.
#
# Succeeds the flat `ocx.sh/reviewdog` coordinate this repository published
# before the grouped layout.
target:
  registry: ghcr.io
  repository: ocx-contrib/reviewdog/reviewdog

source:
  type: github_release
  owner: reviewdog
  repo: reviewdog
  tag_pattern: "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"

# ─── libc gate (Phase 3.5) — the evidence, not the conclusion ───────────────
#
# reviewdog is a pure-Go binary built without cgo, so upstream ships ONE Linux
# build per arch and it is fully static. Measured on v0.21.0:
#
#   $ file reviewdog          # from reviewdog_0.21.0_Linux_x86_64.tar.gz
#   ELF 64-bit LSB executable, x86-64, statically linked, BuildID=…, stripped
#   $ readelf -l … | grep INTERP  → (none)
#   $ readelf -d … | grep NEEDED  → (none)
#   $ file reviewdog          # from reviewdog_0.21.0_Linux_arm64.tar.gz
#   ELF 64-bit LSB executable, ARM aarch64, statically linked, …
#
# No PT_INTERP and no DT_NEEDED means the artifact requires nothing of the
# host, so both Linux keys are BARE — no `+libc.*` suffix. Upstream publishes
# no musl/alpine variant, so there is no counterpart to split against. Container
# legs (ubuntu + alpine + fedora) live in ../mirror-base.yml and are what turn
# that claim into evidence.
#
# ─── Scope (verified against every in-range release, v0.20.0 … v0.21.0)
#
# Upstream also publishes, and this mirror deliberately does not carry:
#   reviewdog_*_{Linux,Windows}_i386.tar.gz   — no 32-bit GHA runner
#   reviewdog_*_{Linux,Windows}_armv6.tar.gz  — no armv6 GHA runner
#   checksums.txt                             — sidecar
#
# `arm64` and `armv6` are distinct literals, so `_arm64\.tar\.gz$` cannot reach
# the armv6 tarball, and `x86_64` cannot reach `i386`. Resolution verified BOTH
# ways across EVERY in-range release (v0.20.0, v0.20.1, v0.20.2, v0.20.3,
# v0.21.0 — the asset set is identical in all five): each of the six patterns
# matches EXACTLY one asset. A pattern matching zero is silently skipped, not
# an error — it would yield a green run with a missing platform.
assets:
  linux/amd64:
    - "^reviewdog_.*_Linux_x86_64\\.tar\\.gz$"
  linux/arm64:
    - "^reviewdog_.*_Linux_arm64\\.tar\\.gz$"
  darwin/amd64:
    - "^reviewdog_.*_Darwin_x86_64\\.tar\\.gz$"
  darwin/arm64:
    - "^reviewdog_.*_Darwin_arm64\\.tar\\.gz$"
  windows/amd64:
    - "^reviewdog_.*_Windows_x86_64\\.tar\\.gz$"
  windows/arm64:
    - "^reviewdog_.*_Windows_arm64\\.tar\\.gz$"

asset_type:
  # Flat tarball — `LICENSE`, `README.md` and the `reviewdog` executable sit at
  # the archive root, with no version-stamped wrapper directory to strip. The
  # executable therefore lands at the content root, which is why `bin_scan` is
  # `off` in ../mirror-base.yml.
  type: archive
  strip_components: 0

metadata:
  default: metadata.json

catalog:
  logo: logo.svg

versions:
  min: "0.20.0"
  new_per_run: 10
  poll_interval: "0 */6 * * *"

tests:
  # `script:` resolves from the REPOSITORY ROOT — unlike `metadata.default` and
  # `catalog.logo` above, which resolve against this spec's own directory.
  - name: smoke
    script: reviewdog/tests/smoke.star

annotations:
  # From the Phase 1.5 license gate:
  #   $ gh api repos/reviewdog/reviewdog/license --jq '.license.spdx_id'
  #   MIT
  org.opencontainers.image.licenses: "MIT"

announce:
  # Spelled out, not derived from target.repository — the logical name and the
  # physical path are related by convention only.
  package: reviewdog/reviewdog
  fork: ocx-contrib/index
